<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Div and Span Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      padding: 20px;
      border: 2px solid #333;
      width: 90%;
      margin: auto;
    }

    .header {
      background-color: #0d6efd;
      color: white;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .content {
      background-color: #e9ecef;
      padding: 15px;
      margin-bottom: 20px;
    }

    .highlight {
      color: red;
      font-weight: bold;
    }

    .note {
      background-color: yellow;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <h1>Div and Span Example</h1>
    </div>

    <div class="content">
      <p>
        This page uses <span class="highlight">div elements</span> for layout
        and <span class="note">span elements</span> for inline styling.
      </p>
    </div>

    <div class="footer">
      <p>Footer Section</p>
    </div>

  </div>

</body>
</html>
