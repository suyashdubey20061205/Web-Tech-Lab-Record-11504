<!DOCTYPE html>
<html>
<head>
  <title>CSS Types Example</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Internal CSS -->
  <style>
    h1 {
      color: blue;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Internal CSS applied -->
  <h1>This heading is styled using internal CSS.</h1>

  <!-- External CSS applied -->
  <p>This paragraph is styled using external CSS.</p>

  <!-- Inline CSS applied -->
  <p style="color: red; font-weight: bold;">
    This paragraph uses inline CSS.
  </p>

</body>
</html>
