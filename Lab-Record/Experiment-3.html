<!DOCTYPE html>
<html>
<head>
  <title>Table based layout</title>
</head>
<body>

<table border="1" width="50%" align="center">
  <caption><strong>Student Marks</strong></caption>

  <tr>
    <th rowspan="2">Name</th>
    <th colspan="2">Marks</th>
  </tr>

  <tr>
    <th>Math</th>
    <th>Science</th>
  </tr>

  <tr align="center">
    <td align="left">Alice</td>
    <td>85</td>
    <td>90</td>
  </tr>

  <tr align="center">
    <td align="left">Bob</td>
    <td>78</td>
    <td>88</td>
  </tr>

</table>

</body>
</html>
